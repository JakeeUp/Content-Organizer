[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "content-organizer"
dynamic = ["version"]
description = "Sort a creator's messy media inbox into vertical/horizontal videos, audio, images and projects - with dry-run and undo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Fernandez" }]
maintainers = [{ name = "Jacob Fernandez" }]
requires-python = ">=3.11"
dependencies = ["platformdirs>=3.0"]
keywords = [
    "video",
    "organizer",
    "ffprobe",
    "ffmpeg",
    "content-creator",
    "media",
    "file-management",
    "shorts",
    "pyqt6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
# TODO(owner): confirm the GitHub username - these URLs are placeholders.
Homepage = "https://github.com/JakeeUp/Content-Organizer"
Repository = "https://github.com/JakeeUp/Content-Organizer"
Issues = "https://github.com/JakeeUp/Content-Organizer/issues"
Changelog = "https://github.com/JakeeUp/Content-Organizer/blob/main/CHANGELOG.md"
Documentation = "https://github.com/JakeeUp/Content-Organizer#readme"

[project.scripts]
content-organizer = "content_organizer.cli:main"

[project.gui-scripts]
content-organizer-gui = "content_organizer.gui.app:main"

[tool.hatch.version]
path = "src/content_organizer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/content_organizer"]

[tool.hatch.build.targets.sdist]
include = ["src/content_organizer", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]
ignore = [
    "PTH123", # open() is fine alongside pathlib
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error::SyntaxWarning"]
markers = [
    "ffmpeg: needs real ffmpeg/ffprobe binaries on PATH (skipped otherwise)",
]

# Coverage gate applies to the Qt-free core; the GUI has its own pytest-qt tests but is
# omitted from the threshold (rendering/dialog code is not meaningfully line-covered).
# Run with: pytest --cov --cov-report=term-missing
[tool.coverage.run]
source = ["content_organizer"]
branch = true
omit = ["*/content_organizer/gui/*", "*/content_organizer/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
packages = ["content_organizer"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

