name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" "pyinstaller>=6.6"
      - name: Build ContentOrganizer.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ContentOrganizer
          --collect-data content_organizer
          packaging/pyinstaller_entry.py
      - name: Smoke test (import only)
        run: python -c "import content_organizer.gui.app"
      - uses: actions/upload-artifact@v7
        with:
          name: ContentOrganizer-windows
          path: dist/ContentOrganizer.exe
          if-no-files-found: error

  build-macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" "pyinstaller>=6.6"
      - name: Build ContentOrganizer.app
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ContentOrganizer
          --collect-data content_organizer
          packaging/pyinstaller_entry.py
      - name: Zip app bundle
        run: cd dist && ditto -c -k --keepParent ContentOrganizer.app ContentOrganizer-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ContentOrganizer-macos
          path: dist/ContentOrganizer-macos.zip
          if-no-files-found: error

  build-python:
    name: sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/ContentOrganizer.exe
            artifacts/ContentOrganizer-macos.zip
            artifacts/*.whl
            artifacts/*.tar.gz
